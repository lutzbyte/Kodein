name: Kodein Android Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK Packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Generate Native Android Project
        run: bunx expo prebuild --platform android --no-install --non-interactive

      - name: Configure Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Error: Android keystore secrets belum lengkap."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/kodein-release.jks

          cat >> android/gradle.properties <<EOF

          MYAPP_UPLOAD_STORE_FILE=kodein-release.jks
          MYAPP_UPLOAD_KEY_ALIAS=$KEY_ALIAS
          MYAPP_UPLOAD_STORE_PASSWORD=$KEYSTORE_PASSWORD
          MYAPP_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD
          EOF

      - name: Configure Gradle Release Signing
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path("android/app/build.gradle")

          if not path.exists():
              sys.exit("android/app/build.gradle tidak ditemukan.")

          content = path.read_text()

          # Cari blok buildTypes.
          match = re.search(r'\bbuildTypes\s*\{', content)
          if not match:
              sys.exit("Blok buildTypes tidak ditemukan.")

          def find_block_end(text, opening_brace):
              depth = 0
              for i in range(opening_brace, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          return i
              return -1

          build_types_open = content.find("{", match.start())
          build_types_end = find_block_end(content, build_types_open)

          if build_types_end == -1:
              sys.exit("Blok buildTypes tidak valid.")

          build_types = content[build_types_open:build_types_end + 1]
          release_match = re.search(r'\brelease\s*\{', build_types)

          if not release_match:
              sys.exit("Blok buildTypes.release tidak ditemukan.")

          release_open = build_types.find("{", release_match.start())
          release_end = find_block_end(build_types, release_open)

          if release_end == -1:
              sys.exit("Blok release tidak valid.")

          release_block = build_types[release_open:release_end + 1]

          # Pastikan signingConfigs.release tersedia.
          signing_match = re.search(r'\bsigningConfigs\s*\{', content)

          if not signing_match:
              android_match = re.search(r'\bandroid\s*\{', content)
              if not android_match:
                  sys.exit("Blok android tidak ditemukan.")

              android_open = content.find("{", android_match.start())
              content = (
                  content[:android_open + 1]
                  + """
              signingConfigs {
                  release {
                      storeFile file(MYAPP_UPLOAD_STORE_FILE)
                      storePassword MYAPP_UPLOAD_STORE_PASSWORD
                      keyAlias MYAPP_UPLOAD_KEY_ALIAS
                      keyPassword MYAPP_UPLOAD_KEY_PASSWORD
                  }
              }
          """
                  + content[android_open + 1:]
              )

              # Hitung ulang posisi blok setelah perubahan.
              match = re.search(r'\bbuildTypes\s*\{', content)
              build_types_open = content.find("{", match.start())
              build_types_end = find_block_end(content, build_types_open)
              build_types = content[build_types_open:build_types_end + 1]
              release_match = re.search(r'\brelease\s*\{', build_types)
              release_open = build_types.find("{", release_match.start())
              release_end = find_block_end(build_types, release_open)
              release_block = build_types[release_open:release_end + 1]

          # Pastikan konfigurasi release mengarah ke keystore release.
          if re.search(r'\bsigningConfig\s+signingConfigs\.release\b', release_block):
              print("Release signing sudah dikonfigurasi.")
          elif re.search(r'\bsigningConfig\s+signingConfigs\.debug\b', release_block):
              release_block = re.sub(
                  r'\bsigningConfig\s+signingConfigs\.debug\b',
                  'signingConfig signingConfigs.release',
                  release_block,
                  count=1
              )
          else:
              release_block = release_block[:-1] + """
                  signingConfig signingConfigs.release
              }"""

          updated_build_types = (
              build_types[:release_open]
              + release_block
              + build_types[release_end + 1:]
          )

          content = (
              content[:build_types_open]
              + updated_build_types
              + content[build_types_end + 1:]
          )

          path.write_text(content)
          print("Release signing berhasil dikonfigurasi.")
          PY

      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease

      - name: Show APK Information
        run: |
          echo "APK berhasil dibuat:"
          ls -lh android/app/build/outputs/apk/release/app-release.apk

      - name: Show Keystore Fingerprints
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list -v \
            -keystore android/app/kodein-release.jks \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" \
            | grep -E "SHA1:|SHA256:"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kodein-android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Kodein ${{ github.ref_name }}
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/app-release.apk
