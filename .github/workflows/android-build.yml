name: Kodein Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kodein-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK Packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Environment Secrets
        run: |
          test -n "$EXPO_PUBLIC_FIREBASE_API_KEY" || (echo "Missing Firebase API Key" && exit 1)
          test -n "$EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN" || (echo "Missing Firebase Auth Domain" && exit 1)
          test -n "$EXPO_PUBLIC_FIREBASE_PROJECT_ID" || (echo "Missing Firebase Project ID" && exit 1)
          test -n "$EXPO_PUBLIC_FIREBASE_APP_ID" || (echo "Missing Firebase App ID" && exit 1)
          test -n "$EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID" || (echo "Missing Google Web Client ID" && exit 1)

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Generate Native Android Project
        run: bunx expo prebuild --platform android --no-install --non-interactive

      - name: Configure Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Error: Android keystore secrets belum lengkap."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/kodein-release.jks

          test -s android/app/kodein-release.jks || (echo "Keystore gagal dibuat." && exit 1)

          cat >> android/gradle.properties <<EOF

          MYAPP_UPLOAD_STORE_FILE=kodein-release.jks
          MYAPP_UPLOAD_KEY_ALIAS=$KEY_ALIAS
          MYAPP_UPLOAD_STORE_PASSWORD=$KEYSTORE_PASSWORD
          MYAPP_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD
          EOF

      - name: Configure Gradle Release Signing
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          content = path.read_text()

          def find_block_end(text, opening):
              depth = 0
              for i in range(opening, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          return i
              raise RuntimeError("Blok Gradle tidak valid.")

          match = re.search(r'\bsigningConfigs\s*\{', content)

          if not match:
              raise RuntimeError("Blok signingConfigs tidak ditemukan.")

          signing_open = content.find("{", match.start())
          signing_close = find_block_end(content, signing_open)
          signing_content = content[signing_open + 1:signing_close]

          if not re.search(r'\brelease\s*\{', signing_content):
              release_config = """
                  release {
                      storeFile file(MYAPP_UPLOAD_STORE_FILE)
                      storePassword MYAPP_UPLOAD_STORE_PASSWORD
                      keyAlias MYAPP_UPLOAD_KEY_ALIAS
                      keyPassword MYAPP_UPLOAD_KEY_PASSWORD
                  }
              """
              content = content[:signing_close] + release_config + content[signing_close:]

          match = re.search(r'\bbuildTypes\s*\{', content)

          if not match:
              raise RuntimeError("Blok buildTypes tidak ditemukan.")

          build_open = content.find("{", match.start())
          build_close = find_block_end(content, build_open)
          build_content = content[build_open + 1:build_close]
          release_match = re.search(r'\brelease\s*\{', build_content)

          if not release_match:
              raise RuntimeError("Blok buildTypes.release tidak ditemukan.")

          release_open = content.find("{", build_open + 1 + release_match.start())
          release_close = find_block_end(content, release_open)
          release_content = content[release_open + 1:release_close]

          release_content = re.sub(
              r'\bsigningConfig\s+signingConfigs\.debug\b',
              'signingConfig signingConfigs.release',
              release_content
          )

          if not re.search(r'\bsigningConfig\s+signingConfigs\.release\b', release_content):
              release_content = "\n            signingConfig signingConfigs.release\n" + release_content

          content = content[:release_open + 1] + release_content + content[release_close:]
          path.write_text(content)

          print("Release signing berhasil dikonfigurasi.")
          PY

      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "APK tidak ditemukan."
            exit 1
          fi

          echo "APK berhasil dibuat:"
          ls -lh "$APK"

      - name: Show Keystore Fingerprints
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list -v \
            -keystore android/app/kodein-release.jks \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" \
            | grep -E "SHA1:|SHA256:"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kodein-android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Generate Changelog
        if: startsWith(github.ref, 'refs/tags/')
        id: changelog
        shell: bash
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"

          PREVIOUS_TAG=$(git tag --sort=-version:refname \
            | grep -Fxv "$CURRENT_TAG" \
            | head -n 1 || true)

          if [ -n "$PREVIOUS_TAG" ]; then
            COMMITS=$(git log "$PREVIOUS_TAG..$CURRENT_TAG" \
              --pretty=format:"%s" --no-merges)
          else
            COMMITS=$(git log "$CURRENT_TAG" \
              --pretty=format:"%s" --no-merges)
          fi

          FEATURES=""
          FIXES=""
          IMPROVEMENTS=""
          UI=""
          OTHER=""

          while IFS= read -r message; do
            [ -z "$message" ] && continue

            case "$message" in
              feat:*|feature:*)
                FEATURES="${FEATURES}- ${message#*: }"$'\n'
                ;;
              fix:*|bugfix:*)
                FIXES="${FIXES}- ${message#*: }"$'\n'
                ;;
              perf:*|improve:*)
                IMPROVEMENTS="${IMPROVEMENTS}- ${message#*: }"$'\n'
                ;;
              ui:*|design:*)
                UI="${UI}- ${message#*: }"$'\n'
                ;;
              *)
                OTHER="${OTHER}- ${message}"$'\n'
                ;;
            esac
          done <<< "$COMMITS"

          {
            echo "## What's New in Kodein ${CURRENT_TAG}"
            echo
            echo "Terima kasih telah menggunakan Kodein! Berikut perubahan pada versi ini."
            echo

            if [ -n "$FEATURES" ]; then
              echo "### ✨ New Features"
              printf '%s' "$FEATURES"
              echo
            fi

            if [ -n "$FIXES" ]; then
              echo "### 🐛 Bug Fixes"
              printf '%s' "$FIXES"
              echo
            fi

            if [ -n "$IMPROVEMENTS" ]; then
              echo "### ⚡ Improvements"
              printf '%s' "$IMPROVEMENTS"
              echo
            fi

            if [ -n "$UI" ]; then
              echo "### 🎨 UI/UX Updates"
              printf '%s' "$UI"
              echo
            fi

            if [ -n "$OTHER" ]; then
              echo "### 🔧 Other Changes"
              printf '%s' "$OTHER"
              echo
            fi

            echo "### 📦 Download"
            echo "Download APK melalui file \`app-release.apk\` di bawah."
          } > release-notes.md

          cat release-notes.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Kodein ${{ github.ref_name }}
          body_path: release-notes.md
          files: android/app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
