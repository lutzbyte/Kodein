changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - github-actions[bot]

  categories:
    - title: "✨ New Features"
      labels:
        - feature
        - enhancement

    - title: "🐛 Bug Fixes"
      labels:
        - bug
        - bugfix

    - title: "⚡ Improvements"
      labels:
        - improvement
        - performance

    - title: "🎨 UI/UX Updates"
      labels:
        - ui
        - design

    - title: "🔧 Other Changes"
      labels:
        - "*"
